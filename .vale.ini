# The prose rules for this repo. Every runtime that checks our writing reads
# THIS file and nothing else: the local CLI and the `prose` workflow on pull
# requests (elecnix/vale-action, which reads its rules from here). A rule
# changes in one place and every runtime moves with it.
#
# Vale walks up from the file it lints to find this config, so a bare
# `vale --no-global <path>` anywhere in the repo already has its rules. Run
# `vale --no-global sync` once after cloning to fetch the upstream packs.
StylesPath = tools/ci/vale/styles
MinAlertLevel = warning

# Upstream rules are fetched, not vendored. `vale sync` writes them into
# StylesPath in under a second and leaves noslop/ alone.
# Pin the version here: this line is the whole upgrade.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.34.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.34.0/ai-tells-experimental.zip

[*.{md,mdx}]
BasedOnStyles = ai-tells, ai-tells-experimental, noslop
# GardenPath's false-positive class that this line removes is the
# pronoun-led relative clause
# ("Anyone who applies now gets a bonus": unambiguous). RE2 has no
# lookbehind, so the rule token cannot express that exclusion; the ignore
# below strips the span before checks run. Shape notes, each learned by
# experiment and none producing an error when violated:
#
# - The gap `[a-z\s]+?` between the pronoun and its verb covers clauses with
#   intervening words ("the name that a client sends now picks"), which the
#   rule's own remedy produces, and the line wraps this repo's markdown uses.
# - `(?i)` covers a sentence-initial pronoun ("Who applies now gets a
#   bonus."). The ini file has no global case flag.
# - `\s+` matches the hard line wraps this repo's markdown uses. Literal
#   spaces miss a wrap that breaks before "now".
# - Brace quantifiers do not work here: the ini parser consumes `{...}`, so
#   the pattern uses `[a-z][a-z]+s` instead of `[a-z]{2,}s`.
# - This strips spans from every sentence-scoped check in this section, the
#   150 upstream ai-tells rules included, not only GardenPath.
TokenIgnores = (?i)\b(?:who|that|which|whose)[a-z\s]+?[a-z][a-z]+s\s+now\s+[a-z][a-z]+s\b