# Prose lint: Vale reads the markdown a pull request changed, against this
# repository's own rules. `.vale.ini` at the repo root pins the upstream
# ai-tells packs and `tools/ci/vale/styles/noslop/` holds ours; the action
# reads its rules from here and carries none of its own, so what it reports
# matches what `vale` prints on a contributor's laptop after `vale sync`.
#
# Error-level alerts fail the `vale` check; warnings and suggestions are
# reported without failing it. Only the alerts that fall on the lines the pull
# request writes count, so a change is never failed over prose it did not
# write; the alerts left out are counted in the comment and named as left out.
# On a fork pull request the read-only token cannot post the comment or set the
# check, and the action falls back to a job summary rather than failing the
# run.
#
# The full-length SHA pin mirrors docs/release.md: a prose gate that floats
# on a tag can change its verdict between two runs of the same commit.
# v1.1.1 pins the release. It reads the added lines from this pull request's
# own diff rather than from the files API, which drops `patch` for a diff it
# considers too large — a 1748-line file was enough — and a missing patch used
# to be read as "no added lines", which counted the whole file
# (elecnix/vale-action#5). It also counts only the lines a change writes, the
# narrowing added in v1.1.0 (elecnix/vale-action#4), and carries the fix for
# elecnix/vale-action#2 that was pinned here before: a re-run of a superseded
# commit no longer repaints the pinned comment or publishes a stale check run
# for a non-head sha. The `vale-version` input is pinned for the same reason
# the action is: the linter decides what gets reported, so a floating linter
# moves the verdict too.

name: prose

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  # One lint per pull request at a time; the comment is edited in place, so
  # cancelling a superseded run loses nothing.
  group: prose-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: elecnix/vale-action@a8c2225c38f990ea957c63c6aabc505dd49e6ab5 # v1.1.1: read the added lines from the pull request's own diff (vale-action#5)
        with:
          # The action defaults to this version, pinned here so a change to
          # that default cannot move this gate's verdict unnoticed.
          vale-version: '3.20.0'