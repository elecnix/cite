# # PR measurement + fix proof: the action under test is the one on this
# branch (uses: ./), exercised on both the self-hosted ARC label and the
# hosted label. Both jobs must reach "Run Cite review" for the fix to count
# as proven on both.

name: arc-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: cite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arc:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Review this pull request with Cite
        uses: ./
        with:
          model_id: deepseek/deepseek-v4-flash-0731
          model_base_url: https://openrouter.ai/api/v1
          model_api_key: ${{ secrets.MODEL_API_KEY }}

  hosted:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Review this pull request with Cite
        uses: ./
        with:
          model_id: deepseek/deepseek-v4-flash-0731
          model_base_url: https://openrouter.ai/api/v1
          model_api_key: ${{ secrets.MODEL_API_KEY }}
