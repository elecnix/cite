# Release workflow — tag-driven, with build provenance attestation.
#
# WHY this shape (PLAN.md §12 invariant I8: "SHA-pinnable, provenance-signed,
# reproducible"):
#
#   * Every `uses:` step is pinned to a full-length commit SHA. Consumers pin
#     the cite Action to a release SHA precisely so a compromised release tag
#     or token cannot ship them attacker code; our own release pipeline must
#     hold itself to the same standard.
#   * Each binary is attested with actions/attest-build-provenance, which
#     publishes a signed SLSA build provenance to the repository's attestation
#     store. Consumers verify it with:
#       gh attestation verify <artifact> -R elecnix/cite
#     tying the artifact they run back to this exact workflow run and tag.
#   * Binaries are built with CGO_ENABLED=0, -trimpath and -ldflags '-s -w':
#     fully static, no host filesystem or toolchain paths embedded, stripped —
#     the same tag rebuilds bit-for-bit-identical artifacts on any runner.
#   * The `pins` job runs before anything is built: the tag, VERSION (which the
#     composite action reads to pick its binary) and cmd/cite/main.go (which
#     the binary reports) must name the same release, so a release cannot
#     publish an action that downloads a different version than it runs.
#
# Triggered by pushing a tag matching 'v*' (e.g. v0.1.0). See docs/release.md.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the release and upload binaries
  attestations: write # publish build provenance attestations
  id-token: write # OIDC token for keyless attestation signing

jobs:
  # Before anything is built: the tag, VERSION (which the composite action
  # reads to pick the binary) and cmd/cite/main.go (which the binary reports)
  # all have to name the same release. A tag pushed against a tree where they
  # disagree would publish a release whose action downloads a different one,
  # and a consumer would only find out from the job log (issue #94).
  pins:
    name: verify the version pins agree with the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the version pins agree with the tag
        run: bash scripts/version-check.sh "$GITHUB_REF_NAME"

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: pins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout source at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' \
            -o "cite-${GOOS}-${GOARCH}" ./cmd/cite

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: cite-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cite-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cite-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh run download -R "$GITHUB_REPOSITORY" "${{ github.run_id }}" --dir dist
          # gh run download nests each artifact in its own directory; move
          # the binaries out flat. The destination differs from the source
          # dir names on purpose: moving dist/X/cite-X into dist/ would just
          # land back inside the existing dist/X directory.
          find dist -type f -name 'cite-*' -exec mv {} assets/ \;
          ls -l assets

      - name: Attach binaries to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: assets/cite-*
          generate_release_notes: true

  # After the binaries are attached, because everything above can succeed and still
  # leave a release nobody can use: an asset missing from the release, an upload that
  # produced an empty file, a binary built from a tree naming a different version.
  # Each of those is indistinguishable from a good release until a consumer's
  # workflow fails on it, which is the worst place to find out.
  #
  # No `uses:` step on purpose: `gh` and `curl` are already on the runner, and every
  # action added here would be another pin to keep current for a job that only reads.
  verify:
    name: verify the attached binaries
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every binary is attached and downloadable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          for arch in linux-amd64 linux-arm64 darwin-arm64; do
            name="cite-$arch"
            json="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets \
              --jq ".assets[] | select(.name == \"$name\") | {url, size, state}")"
            [ -n "$json" ] || { echo "$name is not attached to $tag"; exit 1; }
            url="$(printf '%s' "$json" | jq -r .url)"
            size="$(printf '%s' "$json" | jq -r .size)"
            state="$(printf '%s' "$json" | jq -r .state)"
            [ "$state" = "uploaded" ] || { echo "$name is in state $state"; exit 1; }
            [ "$size" -gt 0 ] || { echo "$name is empty"; exit 1; }
            # The URL a consumer's action downloads from, and a real status code:
            # the release knowing the asset exists is not the same thing as it being
            # fetchable, and that difference shows up in somebody else's CI.
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L "$url")"
            [ "$code" = "200" ] || { echo "$name answered HTTP $code"; exit 1; }
            echo "$name: HTTP 200, $size bytes"
          done

      - name: The binary reports the version it was released under
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The artifact of record, run rather than listed: a release whose binary
          # prints a different version than its tag is the same disagreement the pins
          # job checks for in the tree, asked here of what was actually published.
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --pattern 'cite-linux-amd64' --clobber
          chmod +x cite-linux-amd64
          reported="$(./cite-linux-amd64 version)"
          expected="cite ${GITHUB_REF_NAME#v}"
          [ "$reported" = "$expected" ] || {
            echo "the attached binary reports '$reported', the tag names '$expected'"
            exit 1
          }
          echo "$reported"
