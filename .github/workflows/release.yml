# Release workflow — tag-driven, with build provenance attestation.
#
# WHY this shape (PLAN.md §12 invariant I8: "SHA-pinnable, provenance-signed,
# reproducible"):
#
#   * Every `uses:` step is pinned to a full-length commit SHA. Consumers pin
#     the cite Action to a release SHA precisely so a compromised release tag
#     or token cannot ship them attacker code; our own release pipeline must
#     hold itself to the same standard.
#   * Each binary is attested with actions/attest-build-provenance, which
#     publishes a signed SLSA build provenance to the repository's attestation
#     store. Consumers verify it with:
#       gh attestation verify <artifact> -R elecnix/cite
#     tying the artifact they run back to this exact workflow run and tag.
#   * Binaries are built with CGO_ENABLED=0, -trimpath and -ldflags '-s -w':
#     fully static, no host filesystem or toolchain paths embedded, stripped —
#     the same tag rebuilds bit-for-bit-identical artifacts on any runner.
#
# Triggered by pushing a tag matching 'v*' (e.g. v0.1.0). See docs/release.md.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the release and upload binaries
  attestations: write # publish build provenance attestations
  id-token: write # OIDC token for keyless attestation signing

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout source at tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod

      - name: Verify action.yml default matches the tag
        run: |
          set -euo pipefail
          # The composite action downloads its own release binary, and the
          # version input selects which one. If the default here lags the
          # tag being released, every consumer who pins uses: alone silently
          # keeps running the previous release's binary (that is exactly how
          # v0.2.0 shipped pointing at v0.1.3). Fail the release instead.
          default=$(grep -A4 '^  version:' action.yml | grep -oP "default: '\K[^']+" | head -1)
          echo "action.yml version default: ${default}; releasing ${GITHUB_REF_NAME}"
          if [ "$default" != "$GITHUB_REF_NAME" ]; then
            echo "::error::action.yml version default (${default}) does not match the release tag (${GITHUB_REF_NAME}). Bump the default in the same change that cuts the release."
            exit 1
          fi

      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' \
            -o "cite-${GOOS}-${GOARCH}" ./cmd/cite

      - name: Attest build provenance
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v1.4.3
        with:
          subject-path: cite-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cite-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cite-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh run download -R "$GITHUB_REPOSITORY" "${{ github.run_id }}" --dir dist
          # gh run download nests each artifact in its own directory; move
          # the binaries out flat. The destination differs from the source
          # dir names on purpose: moving dist/X/cite-X into dist/ would just
          # land back inside the existing dist/X directory.
          find dist -type f -name 'cite-*' -exec mv {} assets/ \;
          ls -l assets

      - name: Attach binaries to GitHub release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: assets/cite-*
          generate_release_notes: true
