# Nightly canary: exercise every leg of the provider/fallback chain (PLAN §6).
#
# An untested fallback is not a fallback but a second outage that begins at
# the same moment as the first. Each declared provider and fallback entry
# gets one bounded ping; results are reported per leg. Skipped legs (no
# resolvable credential) are loud, never silent.
#
# Fleet note: a fleet-wide COULD_NOT_EVALUATE should page ONCE with one
# pinned notice, not per repository — aggregation belongs to the fleet
# monitor, not this file.

name: canary
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Exercise provider legs
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
        run: go run ./cmd/cite canary --config .github/cite.yml
