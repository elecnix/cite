name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.22'
          cache: false # zero external dependencies — there is no go.sum to cache against
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/cite
      - name: validate own config
        run: go run ./cmd/cite validate .github/cite.yml || test ! -f .github/cite.yml
      - name: shell tests (fetch-config)
        run: bash scripts/fetch-config_test.sh && bash scripts/fetch-config-retry_test.sh
      - name: shell tests (version default)
        run: bash scripts/download-cite_test.sh
      - name: version pins
        run: bash scripts/version-check.sh
      - name: action pins
        run: bash scripts/action-pins_test.sh
      - name: action.yml duplicate keys
        run: bash scripts/yaml-duplicate-keys_test.sh
      - name: action.yml archive names
        run: bash scripts/action-archive_test.sh
