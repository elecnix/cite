name: review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  checks: write
concurrency:
  group: cite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # The "before" reviewer: the released Cite binary, under the canonical
  # "cite" identity (check run name and sticky marker unchanged).
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Review this pull request with Cite
        uses: elecnix/cite@v0.4.0
        with:
          model_id: deepseek/deepseek-v4-flash-0731
          model_base_url: https://openrouter.ai/api/v1
          model_api_key: ${{ secrets.MODEL_API_KEY }}

  # The "after" reviewer: the binary built from THIS pull request's head,
  # reviewing the same pull request under its own "cite-head" identity
  # (CITE_REVIEWER_ID). Comparing the two reviews on the same pull request
  # shows exactly what the pull request changed about the reviewer itself.
  #
  # I1 (docs/security.md) says a privileged job executes zero PR-head code.
  # This path is the deliberate, gated exception: it runs ONLY for
  # same-repository branches, where head code is controlled by the same
  # people who own the secrets. Fork pull requests get no head review — the
  # `if` guards below are the security boundary, keep them on both jobs.
  build-head:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Build Cite from the pull request head
        run: go build -o cite-head ./cmd/cite
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cite-head-binary
          path: cite-head

  review-head:
    needs: build-head
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cite-head-binary
          path: .
      - name: Review this pull request with the head build of Cite
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: https://openrouter.ai/api/v1
          MODEL_ID: deepseek/deepseek-v4-flash-0731
          GITHUB_TOKEN: ${{ github.token }}
          CITE_REVIEWER_ID: cite-head
        run: |
          set -euo pipefail
          chmod +x ./cite-head
          # PR_NUMBER is not a default runner variable; pull_request events
          # put the number in the ref as refs/pull/N/merge.
          PR_NUM="${PR_NUMBER:-}"
          if [ -z "$PR_NUM" ] && [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            PR_NUM="${GITHUB_REF#refs/pull/}"
            PR_NUM="${PR_NUM%/merge}"
          fi
          if [ -z "$PR_NUM" ]; then
            echo "cite-head: no pull request context (event: ${GITHUB_EVENT_NAME:-unknown}); nothing to review" >&2
            exit 0
          fi
          ./cite-head review --pr "$GITHUB_REPOSITORY#$PR_NUM" --config .github/cite.yml
