# Cite's own configuration. Optional by contract (§6) — everything here
# exists because dogfooding on this repository showed a need, not as an
# example.

model: deepseek/deepseek-v4-flash-0731

# Dogfooding on PR #40 showed deepseek-v4-flash routed through OpenRouter
# intermittently returning free text instead of schema-constrained JSON
# (fenced blocks, single-quoted keys, stray bytes) — an endpoint dropping
# response_format. require_parameters makes the router refuse such endpoints;
# a clean routing error costs nothing, degraded output fails the file.
require_parameters: true

roles:
  review:
    # Dogfooding on PR #41: reviewing a large diff (cmd/cite/review.go) hit
    # finish_reason=length at the built-in 32768-token cap. Raise it so big
    # diffs get complete reviews.
    max_output_tokens: 65536
    # Explicit 15-minute deadlines serve the RELEASED binary this repo's CI
    # runs: without a pin it derives ~572s from the 65536-token cap and loses
    # slow-but-correct calls (two dogfooded runs lost three files at that
    # derivation). Since v0.6.0 the released binary already defaults to 15
    # minutes for both roles, so these pins equal the defaults; they stay
    # explicit for the released-binary window. An explicit
    # roles.<role>.timeout still wins whenever this repository needs a
    # different value again.
    timeout: 15m
  triage:
    timeout: 15m
  # Timeouts on both roles are pinned at 15m above because the released
  # binary this repo's CI runs against derives ~572s for review without a
  # pin. Since v0.6.0 ships the 15-minute defaults, the pins are kept as
  # explicit insurance equal to the defaults — generous, because a hung call
  # is rare while a slow-but-correct one is common, and an explicit
  # roles.<role>.timeout still wins whenever this repository needs one
  # again.
