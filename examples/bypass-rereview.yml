# examples/bypass-rereview.yml
#
# The other half of break-glass (PLAN §11): the bypass label buys time,
# not amnesty. `cite bypass` concludes the Cite check immediately — nobody
# waits on a broken reviewer — and appends one line to a bypass-log sticky
# comment on the pull request. This scheduled job re-reviews every bypassed
# merge commit on the default branch afterwards and files ONE issue per
# blocking finding, so every use of the escape stays countable afterwards
# and nothing slips through unreviewed forever.
#
# Run this hourly for tight amnesty windows or daily with an overlapping
# --since window; overlap re-finds recent bypasses, which is cheaper than a
# gap that lets one escape go uncounted. workflow_dispatch lets you sweep on
# demand. Requires the MODEL_API_KEY repository secret; GITHUB_TOKEN needs
# issues:write.

name: cite-re-review
on:
  schedule:
    - cron: "23 4 * * *" # daily, off the hour to spread fleet load
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  re-review:
    runs-on: ubuntu-latest
    steps:
      - name: Download Cite binary
        shell: bash
        env:
          CITE_VERSION: v0.1.3
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "unsupported runner arch: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          url="https://github.com/elecnix/cite/releases/download/${CITE_VERSION}/cite-linux-${arch}"
          curl -fsSL --retry 3 -o /usr/local/bin/cite "$url"
          chmod +x /usr/local/bin/cite

      - name: Re-review bypassed merges
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          set -euo pipefail
          # --since overlaps the daily cadence by two hours so a missed or
          # delayed scheduled run cannot open an amnesty gap.
          cite re-review --repo "$GITHUB_REPOSITORY" --since 26h
