# examples/minimal.yml
#
# The whole install. No checkout, no `with:` block, no configuration file.
# The provider is inferred from which key is present.
#
# This is the happy path from README.md, verbatim. Copy it, add the
# MODEL_API_KEY repository secret, push a pull request.

name: review
on: pull_request_target
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  review:
    # Forks are not reviewed by default; delete this line to opt in.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: elecnix/cite@534087b12205e442d971bddd7c157354a0c31da1  # v0.14.0
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
