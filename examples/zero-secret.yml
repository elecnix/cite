# examples/zero-secret.yml
#
# A first run without a key (§1). No repository secret to create, no
# vendor account, no credit card: with `models: read` permission, Cite runs
# inference on GitHub's own models endpoint using the ambient GITHUB_TOKEN.
#
# This path is rate-limited and meant for first impressions only — enough to
# see a real review before deciding anything. For serious use, copy
# examples/minimal.yml instead and bring your own MODEL_API_KEY.

name: review
on: pull_request_target
permissions:
  contents: read
  pull-requests: write
  checks: write
  models: read
jobs:
  review:
    # Forks are not reviewed by default; delete this line to opt in.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: elecnix/cite@534087b12205e442d971bddd7c157354a0c31da1  # v0.14.0
