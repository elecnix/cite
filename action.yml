# Cite — an open code reviewer for GitHub.
#
# The happy path needs no `with:` block and no `actions/checkout` OF THE PULL
# REQUEST HEAD. This composite action downloads its own release binary — a
# fixed artifact, not head-controlled code — and reviews the pull request
# from the GitHub API. Nothing from the pull request head is ever executed
# or built (§12 I1).
name: 'Cite'
description: >
  Reviews pull requests with a large language model you choose, posts a real
  review with comments anchored to the lines they are about, and publishes a
  check run that a repository may require before merge. Every finding quotes
  the source line it is about, and the quote is verified against the file.

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  model_api_key:
    description: 'API key for the model provider.'
    required: false
  config_path:
    description: 'Path to .github/cite.yml relative to the base ref. Leave unset for defaults.'
    required: false
    default: '.github/cite.yml'
  dry_run:
    description: 'Set to "true" to print findings without posting.'
    required: false
    default: 'false'
  version:
    description: 'Cite release tag to download.'
    required: false
    default: 'v0.1.3'
  model_base_url:
    description: 'Provider base URL, e.g. https://openrouter.ai/api/v1. Empty means the OpenAI default.'
    required: false
    default: ''
  model_id:
    description: 'Model id, e.g. openai/gpt-4o-mini. Empty means the client default.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Download Cite binary
      shell: bash
      env:
        CITE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "${RUNNER_ARCH}" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported runner arch: ${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        url="https://github.com/elecnix/cite/releases/download/${CITE_VERSION}/cite-linux-${arch}"
        curl -fsSL --retry 3 -o /usr/local/bin/cite "$url"
        chmod +x /usr/local/bin/cite

    - name: Run Cite review
      shell: bash
      env:
        MODEL_API_KEY: ${{ inputs.model_api_key }}
        MODEL_BASE_URL: ${{ inputs.model_base_url }}
        MODEL_ID: ${{ inputs.model_id }}
        GITHUB_TOKEN: ${{ github.token }}
        CITE_CONFIG_PATH: ${{ inputs.config_path }}
        CITE_DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        # PR_NUMBER is not a default runner variable; pull_request events put
        # the number in the ref as refs/pull/N/merge.
        PR_NUM="${PR_NUMBER:-}"
        if [ -z "$PR_NUM" ] && [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
          PR_NUM="${GITHUB_REF#refs/pull/}"
          PR_NUM="${PR_NUM%/merge}"
        fi
        if [ -z "$PR_NUM" ]; then
          echo "cite: no pull request context (event: ${GITHUB_EVENT_NAME:-unknown}); nothing to review" >&2
          exit 0
        fi
        ARGS="--pr $GITHUB_REPOSITORY#$PR_NUM --config $CITE_CONFIG_PATH"
        if [ "$CITE_DRY_RUN" = "true" ]; then
          ARGS="$ARGS --dry-run"
        fi
        cite review $ARGS
