# Cite — an open code reviewer for GitHub.
#
# The happy path needs no `with:` block and no `actions/checkout` OF THE PULL
# REQUEST HEAD. This composite action downloads its own release binary — a
# fixed artifact, not head-controlled code — and reviews the pull request
# from the GitHub API. Nothing from the pull request head is ever executed
# or built (§12 I1).
name: 'Cite'
description: >
  Reviews pull requests with a large language model you choose, posts a real
  review with comments anchored to the lines they are about, and publishes a
  check run that a repository may require before merge. Every finding quotes
  the source line it is about, and the quote is verified against the file.

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  model_api_key:
    description: 'API key for the model provider.'
    required: false
  config_path:
    description: 'Path to .github/cite.yml relative to the base ref. Leave unset for defaults.'
    required: false
    default: '.github/cite.yml'
  dry_run:
    description: 'Set to "true" to print findings without posting.'
    required: false
    default: 'false'
  version:
    description: >
      Cite release tag to download, e.g. v0.9.1. Leave empty (the default) to
      download the release this action belongs to: VERSION is checked out
      beside the action, so `uses: elecnix/cite@<full-sha>` pins the binary as
      well as the action, which is the pair docs/release.md asks consumers to
      pin. Set "latest" to track the newest published release instead, an
      upgrade policy to choose on purpose. Releases up to v0.8.0 floated to
      the newest release whenever this input was empty.
    required: false
    default: ''
  model_base_url:
    description: 'Provider base URL, e.g. https://openrouter.ai/api/v1. Empty means the OpenAI default.'
    required: false
    default: ''
  model_id:
    description: 'Model id, e.g. openai/gpt-4o-mini. Empty means the client default.'
    required: false
    default: ''
  archive_on_failure:
    description: >
      Set to "true" (the default) to upload a forensics artifact when the
      review fails: the full step log, the run record JSON (per-file
      outcomes, the per-call timing log and token usage), and the raw
      response body of any token-cap truncation. The artifact is
      downloadable from the run's summary page once the job completes.
    required: false
    default: 'true'
  archive_run_record:
    description: >
      Set to "true" (the default) to upload the run record JSON when the
      review succeeds, kept for 14 days. Each entry in its calls array has
      the call's timing, tokens, cache reads and writes, and the upstream
      provider, which is where a cache hit rate below its ceiling is
      diagnosed. Set to "false" to skip the upload.
    required: false
    default: 'true'
  tool_failure_blocks:
    description: >
      Set to "true" (the default) to keep a tool failure — Cite could not
      evaluate the pull request, e.g. an unparseable model reply or a
      provider timeout, published as COULD_NOT_EVALUATE — concluding the
      check run as a failure that blocks a required check. Set to "false"
      to let a tool failure conclude "neutral" instead, which does not
      block the merge. A real finding (FOUND) always concludes "failure"
      and blocks regardless of this input: the opt-out covers "the tool
      could not read its own output", never "the tool found something".
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # upload-artifact refuses a name the run already has, so a workflow that
    # runs Cite in two jobs of one run (a matrix, say) needs a name per job.
    # The run id and job id are shared across a matrix, so a random part
    # completes the suffix. This is the first step, so every later failure
    # still has a suffix to name its archive with.
    - name: Name the archives
      id: archive
      shell: bash
      run: echo "suffix=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_OUTPUT"

    # The config file named by config_path is read from the LOCAL
    # filesystem by `cite review`, but the documented install path has no
    # actions/checkout, so it is usually absent from the runner. Fetch it
    # from the pull request's BASE ref — never the head or merge ref, so a
    # pull request cannot rewrite its own review settings or redirect
    # model_base_url to an attacker endpoint (docs/security.md, I3).
    # The base ref is authoritative whenever a pull request context
    # exists: a checkout of the merge ref would leave a head-controlled
    # config on disk, so a local file is only trusted when there is no
    # base ref at all to fetch from. A base ref without the file is not
    # an error: any local file from a checkout is discarded and the run
    # continues with Cite's built-in defaults. Which source was used is
    # always logged.
    - name: Fetch Cite config from the base ref
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CONFIG_PATH: ${{ inputs.config_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
      run: bash "$GITHUB_ACTION_PATH/scripts/fetch-config.sh"

    - name: Download Cite binary
      shell: bash
      env:
        CITE_VERSION: ${{ inputs.version }}
      # Which release this is (issue #94): an unset `version` downloads the
      # release the action itself belongs to, resolved from the VERSION file
      # that is checked out with the action, so a full-SHA pin on `uses:` pins
      # the binary too. `latest` is the opt-in float. scripts/download-cite.sh
      # holds that rule as a testable script; scripts/download-cite_test.sh
      # holds it to the rule.
      run: bash "$GITHUB_ACTION_PATH/scripts/download-cite.sh"

    - name: Run Cite review
      shell: bash
      env:
        MODEL_API_KEY: ${{ inputs.model_api_key }}
        MODEL_BASE_URL: ${{ inputs.model_base_url }}
        MODEL_ID: ${{ inputs.model_id }}
        GITHUB_TOKEN: ${{ github.token }}
        CITE_CONFIG_PATH: ${{ inputs.config_path }}
        CITE_DRY_RUN: ${{ inputs.dry_run }}
        CITE_TOOL_FAILURE_BLOCKS: ${{ inputs.tool_failure_blocks }}
      run: |
        set -euo pipefail
        # PR_NUMBER is not a default runner variable; pull_request events put
        # the number in the ref as refs/pull/N/merge.
        PR_NUM="${PR_NUMBER:-}"
        if [ -z "$PR_NUM" ] && [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
          PR_NUM="${GITHUB_REF#refs/pull/}"
          PR_NUM="${PR_NUM%/merge}"
        fi
        if [ -z "$PR_NUM" ]; then
          echo "cite: no pull request context (event: ${GITHUB_EVENT_NAME:-unknown}); nothing to review" >&2
          exit 0
        fi
        ARGS="--pr $GITHUB_REPOSITORY#$PR_NUM --config $CITE_CONFIG_PATH"
        if [ "$CITE_DRY_RUN" = "true" ]; then
          ARGS="$ARGS --dry-run"
        fi
        # Issue #59: default is fail-closed — a tool failure blocks. A
        # repository may set tool_failure_blocks: false to conclude neutral
        # instead; a real finding still blocks either way.
        case "${CITE_TOOL_FAILURE_BLOCKS:-true}" in
          true)  ;;
          false) ARGS="$ARGS --tool-failure-blocks=false" ;;
          *) echo "cite: invalid tool_failure_blocks value: ${CITE_TOOL_FAILURE_BLOCKS}" >&2; exit 1 ;;
        esac
        # Archive for forensics: tee the full log and dump the run record
        # (per-call timings, token usage, per-file outcomes) even when the run
        # fails. pipefail preserves cite's exit code through the tee.
        CITE_LOG="$RUNNER_TEMP/cite-output.log"
        CITE_RECORD="$RUNNER_TEMP/cite-run-record.json"
        export CITE_RECORD_OUT="$CITE_RECORD"
        # A token-cap truncation discards the partial model output with its
        # error, so cite always writes it to a file. Point the capture at
        # $RUNNER_TEMP so the archive step below uploads it: the file is the
        # only place the pre-cap output is kept, and the stderr line names it.
        CITE_TRUNCATED="$RUNNER_TEMP/cite-truncated-response.json"
        export CITE_TRUNCATED_OUT="$CITE_TRUNCATED"
        cite review $ARGS 2>&1 | tee "$CITE_LOG"

    # The run record alone, on every successful run: its calls[] carry the
    # per-call cache counters and upstream provider, which is how a cache
    # hit rate below its ceiling gets diagnosed. One small JSON file; a
    # failed run gets the full forensics archive below instead.
    - name: Archive the run record
      if: success() && inputs.archive_run_record == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: cite-run-record-${{ steps.archive.outputs.suffix }}
        path: ${{ runner.temp }}/cite-run-record.json
        if-no-files-found: ignore
        retention-days: 14

    - name: Archive forensics on failure
      if: failure() && inputs.archive_on_failure == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: cite-forensics-${{ steps.archive.outputs.suffix }}
        path: |
          ${{ runner.temp }}/cite-output.log
          ${{ runner.temp }}/cite-run-record.json
          ${{ runner.temp }}/cite-truncated-response.json
        if-no-files-found: warn
        retention-days: 30
